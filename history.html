<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BeeLine — History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="history.css" />
  <script src="palettes.js"></script>
  <script src="theme.js"></script>
</head>
<body>
  <div class="window">
    <header>
      <div class="header-row">
        <div class="brand">
          <img class="brand-icon" src="icons/icon128.png" alt="" />
          <div class="brand-text">
            <div class="brand-title">BeeLine</div>
            <div class="brand-credit">By h4l.dev</div>
          </div>
        </div>
        <div class="actions">
          <div class="actions-row">
            <button id="back" title="Back">
              <svg class="icon" viewBox="0 0 24 24"><path d="M20 12H9"/><path class="fill" d="M10 5.5 3.5 12l6.5 6.5Z"/></svg>
            </button>
          </div>
          <div class="actions-row">
            <button id="themeToggle" title="Toggle light/dark mode">
              <svg class="icon icon-moon" viewBox="0 0 24 24"><path class="fill" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              <svg class="icon icon-sun" viewBox="0 0 24 24"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/><circle class="fill" cx="12" cy="12" r="4.5"/></svg>
            </button>
            <button id="website" title="BeeLine website">
              <svg class="icon" viewBox="0 0 24 24"><circle class="fill" cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.6 3.9 5.8 3.9 9.5s-1.3 6.9-3.9 9.5c-2.6-2.6-3.9-5.8-3.9-9.5S9.4 5.1 12 2.5Z"/></svg>
            </button>
            <button id="rate" title="Rate BeeLine">
              <svg class="icon" viewBox="0 0 24 24"><path class="fill" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9Z"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="pills">
        <div class="route-pill" id="routeLabel">Your jobs</div>
        <div class="job-pill" id="jobPill" hidden>
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 10c0 5-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="jobPillText"></span>
        </div>
      </div>
    </header>

    <div id="content" class="sheet"></div>
  </div>

  <script src="proxy.js"></script>
  <script src="route-view.js"></script>
  <script src="history-store.js"></script>
  <script src="history.js"></script>
</body>
</html>
