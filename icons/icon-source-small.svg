    <clipPath id="pin"><path d="M64 122 C51 104 24 86 24 56 A40 40 0 0 1 104 56 C104 86 77 104 64 122 Z"/></clipPath>
  </defs>
  <g fill="#ffffff" stroke="#16161a" stroke-width="10">
